<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Image Gallery</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>📸 Image Gallery</h1>
        <p>Explore the beauty of the world</p>
    </header>

    <main class="container">

        <!-- Category Buttons -->
        <div class="filters">
            <button class="filter-btn active" data-category="all">All</button>
            <button class="filter-btn" data-category="nature">Nature</button>
            <button class="filter-btn" data-category="animals">Animals</button>
            <button class="filter-btn" data-category="cities">Cities</button>
        </div>

        <!-- Image Gallery -->
        <div class="gallery">

            <div class="gallery-item" data-category="nature">
                <img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?w=600"
                     alt="Beautiful mountain lake">
                <div class="image-info">
                    <h3>Mountain Lake</h3>
                    <p>Nature</p>
                </div>
            </div>

            <div class="gallery-item" data-category="nature">
                <img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=600"
                     alt="Green forest">
                <div class="image-info">
                    <h3>Green Forest</h3>
                    <p>Nature</p>
                </div>
            </div>

            <div class="gallery-item" data-category="animals">
                <img src="https://images.unsplash.com/photo-1549366021-9f761d450615?w=600"
                     alt="Wild animal">
                <div class="image-info">
                    <h3>Wildlife</h3>
                    <p>Animals</p>
                </div>
            </div>

            <div class="gallery-item" data-category="cities">
                <img src="https://images.unsplash.com/photo-1519501025264-65ba15a82390?w=600"
                     alt="City skyline">
                <div class="image-info">
                    <h3>City Lights</h3>
                    <p>Cities</p>
                </div>
            </div>

            <div class="gallery-item" data-category="nature">
                <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=600"
                     alt="Beautiful natural landscape">
                <div class="image-info">
                    <h3>Nature View</h3>
                    <p>Nature</p>
                </div>
            </div>

            <div class="gallery-item" data-category="animals">
                <img src="https://images.unsplash.com/photo-1552053831-71594a27632d?w=600"
                     alt="Dog">
                <div class="image-info">
                    <h3>Lovely Dog</h3>
                    <p>Animals</p>
                </div>
            </div>

            <div class="gallery-item" data-category="cities">
                <img src="https://images.unsplash.com/photo-1513635269975-59663e0ac1ad?w=600"
                     alt="London city">
                <div class="image-info">
                    <h3>London</h3>
                    <p>Cities</p>
                </div>
            </div>

            <div class="gallery-item" data-category="nature">
                <img src="https://images.unsplash.com/photo-1472396961693-142e6e269027?w=600"
                     alt="Deer in nature">
                <div class="image-info">
                    <h3>Wild Nature</h3>
                    <p>Nature</p>
                </div>
            </div>

            <div class="gallery-item" data-category="cities">
                <img src="https://images.unsplash.com/photo-1514565131-fce0801e5785?w=600"
                     alt="City buildings">
                <div class="image-info">
                    <h3>Modern City</h3>
                    <p>Cities</p>
                </div>
            </div>

        </div>
    </main>

    <!-- Image Lightbox -->
    <div class="lightbox" id="lightbox">
        <button class="close-btn" id="closeBtn" aria-label="Close">&times;</button>

        <button class="nav-btn prev-btn" id="prevBtn" aria-label="Previous image">
            &#10094;
        </button>

        <img src="" alt="Selected gallery image" id="lightboxImage">

        <button class="nav-btn next-btn" id="nextBtn" aria-label="Next image">
            &#10095;
        </button>

        <p id="imageCaption"></p>
    </div>

    <footer>
        <p>© 2026 Image Gallery | Created with HTML, CSS & JavaScript</p>
    </footer>

    <script src="app.js"></script>
</body>
</html>
